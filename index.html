<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10182f" />
    <meta name="description" content="한곳에서 QR 코드를 만들고 URL을 단축하세요." />
    <title>QRnShort — 링크를 더 간편하게</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="site-wrap">
      <header class="site-header">
        <a class="brand" href="./" aria-label="QRnShort 홈">QR<span>n</span>Short <i aria-hidden="true">✦</i></a>
        <span class="header-note">YOUR LINK TOOLKIT</span>
      </header>
      <main class="home">
        <div class="eyebrow">하나의 링크, 더 많은 가능성 <span aria-hidden="true">✳</span></div>
        <h1>링크를 다루는<br /><em>더 똑똑한 방법.</em></h1>
        <p class="lead">QR 코드로 보여주거나, 짧은 주소로 공유하세요.<br />원하는 도구를 골라 바로 시작할 수 있어요.</p>

        <div class="tool-grid" aria-label="도구 선택">
          <a class="tool-card qr-card" href="url2qr/index.html">
            <span class="tool-icon" aria-hidden="true">▦</span>
            <span class="tool-number">01 / MAKE IT SCANNABLE</span>
            <strong>QR 코드 만들기</strong>
            <span class="tool-description">링크를 한 번의 스캔으로 연결해요.</span>
            <span class="tool-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="tool-card short-card" href="urlShort/index.html">
            <span class="tool-icon" aria-hidden="true">↗</span>
            <span class="tool-number">02 / MAKE IT SHORTER</span>
            <strong>URL 단축하기</strong>
            <span class="tool-description">긴 주소를 짧고 깔끔하게 바꿔요.</span>
            <span class="tool-arrow" aria-hidden="true">↗</span>
          </a>
        </div>
      </main>
      <footer>QRnShort <span aria-hidden="true">✦</span> 만들고, 줄이고, 공유하세요.</footer>
    </div>
  </body>
</html>
